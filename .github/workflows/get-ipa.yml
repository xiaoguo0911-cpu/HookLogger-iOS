name: Get IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot iOS Simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['devices']
          for runtime,devs in d.items():
              if 'iOS' in runtime:
                  for dev in devs:
                      if 'iPhone' in dev['name'] and dev['isAvailable']:
                          print(dev['udid'])
                          exit()
          ")
          echo "SIM=$SIM" >> $GITHUB_ENV
          echo "Booting: $SIM"
          xcrun simctl boot "$SIM" || true
          sleep 20
          xcrun simctl list | grep Booted

      - name: Open URL in Simulator Safari
        run: |
          URL="${{ github.event.inputs.url || 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy' }}"
          echo "Opening: $URL"
          xcrun simctl openurl booted "$URL"
          echo "Waiting 45s for install..."
          sleep 45

      - name: Export IPA
        run: |
          SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM/data"
          echo "Searching apps in: $SIM_DATA"
          find "$SIM_DATA/Containers/Bundle/Application" -name "*.app" -maxdepth 2 2>/dev/null || true

          APP=$(find "$SIM_DATA/Containers/Bundle/Application" -name "*.app" -maxdepth 2 2>/dev/null | tail -1)
          if [ -z "$APP" ]; then
            echo "No app found!"
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p /tmp/Payload
          cp -r "$APP" /tmp/Payload/
          cd /tmp && zip -r downloaded.ipa Payload/
          echo "Done: $(du -sh downloaded.ipa)"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: /tmp/downloaded.ipa
          retention-days: 7
