name: Sim DL IPA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  download:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test network access
        run: |
          echo "=== curl test ==="
          curl -sI "https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy" | head -5 || echo "FAILED"
          curl -sI "https://doe29x10dqvat.cloudfront.net/" | head -5 || echo "FAILED"
          echo "=== done ==="

      - name: Boot iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone 1" | grep -v "unavailable" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_ID=$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true
          sleep 10

      - name: Open URL in Simulator
        run: |
          URL="${{ github.event.inputs.target_url }}"
          echo "Opening: $URL"
          # 先试一个简单 URL
          xcrun simctl openurl "$SIM_ID" "https://apple.com" && echo "apple.com ok"
          sleep 3
          xcrun simctl openurl "$SIM_ID" "$URL" && echo "target URL ok" || echo "target URL FAILED"
          sleep 40

      - name: Find IPA in simulator
        run: |
          SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_ID"
          echo "=== Modified files ==="
          find "$SIM_DATA" -type f -newer /tmp 2>/dev/null | grep -v "\.log\|\.db\|sqlite\|\.DS_Store\|\.plist" | head -20
          echo "=== IPA files ==="
          find "$SIM_DATA" -name "*.ipa" 2>/dev/null | head -10
          echo "=== staged_installer ==="
          find "$SIM_DATA" -name "staged_installer" -type d 2>/dev/null | head -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-${{ github.run_number }}
          path: /tmp/downloaded.ipa
          retention-days: 7
