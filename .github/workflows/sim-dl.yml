name: Sim DL IPA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  download:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mitmproxy via pipx
        run: |
          pipx install mitmproxy
          pipx run mitmdump --version
          pipx run mitmdump -p 8080 --save-stream-file /tmp/traffic.mitm &
          echo $! > /tmp/mitm.pid
          sleep 4
          echo "mitmproxy started"

      - name: Boot iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_ID=$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true
          sleep 8

      - name: Install mitmproxy CA cert in Simulator
        run: |
          CERT="$HOME/.local/pipx/venvs/mitmproxy/lib/python*/site-packages/mitmproxy/certs/mitmproxy-ca-cert.pem"
          CERT=$(ls $HOME/.local/pipx/venvs/mitmproxy/lib/*/site-packages/mitmproxy/certs/mitmproxy-ca-cert.pem 2>/dev/null | head -1)
          echo "cert path: $CERT"
          if [ -f "$CERT" ]; then
            xcrun simctl keychain "$SIM_ID" add-root-cert "$CERT" && echo "cert installed"
          else
            echo "cert not found, checking ~/.mitmproxy"
            ls ~/.mitmproxy/ 2>/dev/null || echo "no dir"
            CERT="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
            [ -f "$CERT" ] && xcrun simctl keychain "$SIM_ID" add-root-cert "$CERT" && echo "cert installed from ~/.mitmproxy"
          fi

      - name: Open URL in iOS Simulator
        run: |
          xcrun simctl openurl "$SIM_ID" "${{ github.event.inputs.target_url }}"
          echo "URL opened, waiting 35s for auto-download..."
          sleep 35

      - name: Extract IPA from traffic
        run: |
          kill $(cat /tmp/mitm.pid) 2>/dev/null || true
          sleep 2
          python3 scripts/sim_extract.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: /tmp/downloaded.ipa
          retention-days: 7
