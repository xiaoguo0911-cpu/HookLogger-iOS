name: Sim DL IPA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  download:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mitmproxy
        run: |
          pip3 install mitmproxy --break-system-packages --quiet
          mitmdump -p 8080 --save-stream-file /tmp/traffic.mitm &
          echo $! > /tmp/mitm.pid
          sleep 3
          echo "mitmproxy started"

      - name: Boot iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_ID=$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true
          sleep 8
          echo "Simulator booted"

      - name: Install mitmproxy CA cert
        run: |
          CERT="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          ls ~/.mitmproxy/ || echo "no .mitmproxy dir"
          if [ -f "$CERT" ]; then
            xcrun simctl keychain "$SIM_ID" add-root-cert "$CERT" && echo "cert installed"
          fi

      - name: Open URL in Simulator
        run: |
          xcrun simctl openurl "$SIM_ID" "${{ github.event.inputs.target_url }}"
          echo "URL opened, waiting..."
          sleep 30

      - name: Extract IPA
        run: |
          kill $(cat /tmp/mitm.pid) 2>/dev/null || true
          sleep 2
          python3 scripts/sim_extract.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: /tmp/downloaded.ipa
          retention-days: 7
