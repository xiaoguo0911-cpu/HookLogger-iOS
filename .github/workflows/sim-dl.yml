name: Sim DL IPA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  download:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone 1" | grep -v "unavailable" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_ID=$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true
          sleep 10
          echo "Simulator booted"

      - name: Open URL and wait for download
        run: |
          URL="${{ github.event.inputs.target_url }}"
          echo "Opening: $URL"
          xcrun simctl openurl "$SIM_ID" "$URL"
          echo "Waiting 40s for auto-download..."
          sleep 40

      - name: Find downloaded IPA in simulator
        run: |
          SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_ID"
          echo "Simulator data: $SIM_DATA"
          
          echo "=== Recently downloaded files ==="
          find "$SIM_DATA" -name "*.ipa" -newer /tmp -ls 2>/dev/null || echo "no .ipa files"
          find "$SIM_DATA" -name "*.zip" -newer /tmp -ls 2>/dev/null | head -5
          
          echo "=== Downloads folder ==="
          find "$SIM_DATA" -path "*/Downloads/*" -ls 2>/dev/null | head -20
          
          echo "=== Staged app files ==="
          find "$SIM_DATA" -name "*.app" -type d 2>/dev/null | head -10
          
          echo "=== All files modified in last 2 min ==="
          find "$SIM_DATA" -newer /tmp -type f 2>/dev/null | grep -v "\.log\|\.db\|sqlite\|\.DS_Store" | head -30

      - name: Check Safari downloads
        run: |
          SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_ID"
          
          # Safari downloads
          find "$SIM_DATA" -path "*Safari*" -type f 2>/dev/null | head -20
          
          # Mobile install staging
          find "$SIM_DATA" -path "*staged_installer*" -type d 2>/dev/null | head -5
          find "$SIM_DATA" -path "*install*" -name "*.ipa" 2>/dev/null | head -5

      - name: Upload any found IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-${{ github.run_number }}
          path: |
            /tmp/downloaded.ipa
            ~/Library/Developer/CoreSimulator/Devices/${{ env.SIM_ID }}/**/*.ipa
          retention-days: 7
