name: Build HookLogger dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || sudo xcode-select -s $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer 2>/dev/null || true
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          echo "SDK=$SDK"

      - name: Build HookLogger.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK"
          xcrun --sdk iphoneos clang             -dynamiclib -arch arm64 -fobjc-arc             -framework Foundation             -miphoneos-version-min=14.0             -isysroot "$SDK"             -o HookLogger.dylib             HookLogger.m
          file HookLogger.dylib
          ls -lh HookLogger.dylib

      - name: Sign
        run: brew install ldid 2>/dev/null || true && ldid -S HookLogger.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: HookLogger-dylib
          path: HookLogger.dylib
