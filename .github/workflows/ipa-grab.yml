name: IPA Grab

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://yjriz.nzctjvr.com/2VHkkYFEvf/vxwmS1ivH7eZWQKy'

jobs:
  download:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          pip3 install playwright pycryptodome --break-system-packages --quiet
          playwright install webkit

      - name: Run
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: python3 scripts/grab.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-${{ github.run_number }}
          path: /tmp/downloaded.ipa
          retention-days: 7
