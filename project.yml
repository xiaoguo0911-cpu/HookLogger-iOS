name: H5Shell
options:
  bundleIdPrefix: com.h5shell
  deploymentTarget:
    iOS: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_BITCODE: NO
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGN_IDENTITY: ""
  TARGETED_DEVICE_FAMILY: "1,2"
  SUPPORTS_MACCATALYST: NO

targets:
  H5Shell:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: H5Shell
        CFBundleDisplayName: H5Shell
        CFBundleIdentifier: com.h5shell.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: H5Shell
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "15.0"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        H5BaseURL: "https://example.com"
        SplashBgR: 26
        SplashBgG: 30
        SplashBgB: 46
        SplashDuration: 10
